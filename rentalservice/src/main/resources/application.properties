spring.application.name=rentalservice
server.port=6060
server.servlet.context-path=/rental-service
logging.file.name=logs/rental-service.log

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://DOMINIC:1433;databaseName=RENTALDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=Dom
spring.datasource.password=123

spring.datasource.hikari.maximum-pool-size=100

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.javax.persistence.validation.mode=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.threads.virtual.enabled=true

# ---- Security / JWT (same property names as galaxy-auth-service where they overlap) ----
# Base64-encoded HMAC key (>= 256 bits). Override with JWT_SECRET in every non-local environment.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktcmVudGFsLXNlcnZpY2Utand0LXNlY3JldC1rZXktY2hhbmdlLW1lLTEyMzQ1Njc4OTA=}
jwt.accessTokenValiditySeconds=${JWT_VALIDITY_SECONDS:3600}
jwt.issuer=rental-service

# Paths the JWT filter skips (relative to the context path)
ignore.urls=/swagger-ui/**,/v3/api-docs/**,/actuator/health,/api/v1/authentication/login,/api/v1/authentication/user,/api/v1/authentication/signup/**,/api/v1/webhooks/**,/mock-bank/**

# Currency for newly created customer / merchant wallets
wallet.currency=NGN

# Virtual accounts (generated in-house; no payment provider)
virtual.account.bank.name=Rental Demo MFB
virtual.account.bank.code=999
virtual.account.name.prefix=RENTAL

# ---- Payment provider (simulated by the mock bank under /mock-bank) ----
# Override both secrets with env vars outside local development.
payment.provider.secret-key=${PROVIDER_SECRET_KEY:sk_test_rental_mock_provider_key}
payment.provider.webhook-secret=${PROVIDER_WEBHOOK_SECRET:whsec_rental_mock_webhook_secret}
# Where the platform calls the provider (requery) and where the provider sends webhooks.
# Resolved at call time, so ${local.server.port} picks up the real port.
payment.provider.base-url=http://localhost:${local.server.port:6060}${server.servlet.context-path}/mock-bank
payment.provider.webhook-url=http://localhost:${local.server.port:6060}${server.servlet.context-path}/api/v1/webhooks/bank-transfer
payment.provider.settlement-delay-ms=3000
payment.provider.webhook-max-attempts=5
payment.provider.webhook-retry-delay-ms=2000

# First staff account, created on startup only if no staff user exists yet.
bootstrap.staff.username=${STAFF_BOOTSTRAP_USERNAME:admin}
bootstrap.staff.email=${STAFF_BOOTSTRAP_EMAIL:admin@rental.local}
bootstrap.staff.password=${STAFF_BOOTSTRAP_PASSWORD:ChangeMe@123}
